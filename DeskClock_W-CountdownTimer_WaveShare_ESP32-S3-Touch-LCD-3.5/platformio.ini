; Desk Countdown Clock - WaveShare ESP32-S3-Touch-LCD-3.5 (SKU 30733)
; ESP32-S3R8: 16 MB QIO flash and 8 MB Octal PSRAM

[platformio]
default_envs = waveshare-30733

[env:waveshare-30733]
platform = espressif32@^6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; Native USB serial and upload support
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_protocol = esptool

; ESP32-S3 N16R8 memory configuration
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=2
    -DTFT_MOSI=1
    -DTFT_SCLK=5
    -DTFT_CS=-1
    -DTFT_DC=3
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    lewisxhe/XPowersLib@^0.3.3
    adafruit/Adafruit BusIO@^1.16.1
    bodmer/TJpg_Decoder@^1.1.0
    adafruit/Adafruit VEML7700 Library@^2.1.6

